# ML-Agents training config for the Sumo fighters (PPO + self-play).
# Run from the folder that contains "config/":
#   mlagents-learn config/sumo.yaml --run-id=sumo1
behaviors:
  Sumo:                       # must match "Behavior Name" in Unity
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 40          # keep many: old checkpoints = "Generation X" footage
    checkpoint_interval: 250000
    max_steps: 10000000           # you can stop earlier with Ctrl+C, progress is saved
    time_horizon: 1000
    summary_freq: 20000
    self_play:
      save_steps: 50000           # how often a snapshot of the AI joins the opponent pool
      team_change: 200000         # how often the learning side switches team
      swap_steps: 10000           # how often the opponent snapshot is swapped
      window: 10                  # how many past snapshots it can face
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
